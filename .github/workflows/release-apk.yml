name: Build and upload beta APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build beta APK
        run: ./gradlew assembleDebug

      - name: Name release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PetalDrive-0.1-Beta.apk

      - name: Save beta APK
        uses: actions/upload-artifact@v4
        with:
          name: PetalDrive-0.1-Beta
          path: PetalDrive-0.1-Beta.apk
          if-no-files-found: error
          retention-days: 14

  upload-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download beta APK
        uses: actions/download-artifact@v4
        with:
          name: PetalDrive-0.1-Beta

      - name: Upload APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" PetalDrive-0.1-Beta.apk --repo "$GITHUB_REPOSITORY" --clobber
